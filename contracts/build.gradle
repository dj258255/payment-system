// 이벤트 계약(published language) 전용 아티팩트 — 발행자(pay)와 프로세스 밖 소비자
// (consumer-app, 추출될 settlement-service)가 공유한다.
//
// 독립 빌드로 두고 소비자들이 Gradle composite build(includeBuild)로 조합한다.
// 퍼블리시 인프라 없이 로컬에서 그대로 물리고, 나중에 사내 저장소 배포로 전환해도
// 소비자 쪽 의존 선언('com.beomsu.pay:pay-contracts')은 그대로다.
//
// 의존성 규율: 계약은 가볍게 유지한다. Spring 전체가 아니라 @Externalized 애노테이션만
// 제공하는 API 전용 아티팩트(spring-modulith-events-api) 하나만 노출(api)한다.
plugins {
    id 'java-library'
}

group = 'com.beomsu.pay'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)        // 메인 프로젝트와 동일 toolchain
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 이벤트 record에 붙는 @Externalized의 출처. 메인의 spring-modulith-bom(1.3.1)과 버전 정렬.
    api 'org.springframework.modulith:spring-modulith-events-api:1.3.1'
}
