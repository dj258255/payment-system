server:
  port: 8090

spring:
  application:
    name: pay-settlement

  # pay와 분리된 전용 스키마. 로컬은 같은 MySQL 컨테이너의 별도 database로 격리한다
  # (compose의 init 스크립트가 생성). 운영이라면 인스턴스 자체를 분리한다.
  datasource:
    url: jdbc:mysql://localhost:3306/pay_settlement
    username: pay
    password: pay
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유한다
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: settlement-service   # 컨슈머 그룹 — 파티션 단위로 소비를 분담·재개한다
      # 새 그룹이 과거 오프셋 없이 시작하면 맨 앞부터 재생한다. 도메인이 멱등이라 재생이 안전하고,
      # 빈 정산 DB를 이벤트 로그로부터 재구성하는 데모(로그가 곧 진실 원천)로도 쓰인다.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # DLT 발행용(DeadLetterPublishingRecoverer). 원본 String 페이로드를 그대로 싣는다.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  lifecycle:
    timeout-per-shutdown-phase: 20s  # pay-core와 동일한 우아한 종료 — 처리 중 이벤트 드레이닝

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: pay-settlement

app:
  # pay-core와 공유하는 JWT 서명 시크릿(HS256). 코어가 발급한 토큰을 여기서 로컬 검증한다.
  # 로컬 개발 기본값은 코어의 기본값과 동일해야 데모 콘솔 토큰이 통과한다. 운영은 env 주입.
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-please-override-with-32byte-min-secret-key}
  # 데모 콘솔(pay-core 정적 서빙)의 오리진. K8s Ingress 도입 시 same-origin이 되어 제거된다.
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:8080}
  settlement:
    enabled: true                    # 이 서비스가 정산 스케줄러의 단일 실행 주체다
    interval-ms: 86400000
    fee-bps: ${APP_SETTLEMENT_FEE_BPS:270}
    payout-business-days: ${APP_SETTLEMENT_PAYOUT_DAYS:2}
