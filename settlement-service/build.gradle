// 정산 서비스 — pay 모놀리스에서 추출된 첫 서비스.
//
// consumer-app과 같은 **독립 Gradle 프로젝트**다(루트 settings.gradle에 include하지 않음).
// 추출 근거는 실측이다(docs/performance/msa-baseline-experiments.md):
//   1) 수평 확장 시 정산 스케줄러 중복 실행(재현) — 정산은 단일 실행 주체가 필요
//   2) 배포 결합(재현) — 정산 수정에 결제가 9초 중단
// 실행: docker compose up -d 후 ./gradlew -p settlement-service bootRun
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'          // 메인 프로젝트와 동일 버전
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.beomsu'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)        // 메인 프로젝트와 동일 toolchain
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 이벤트 계약 — 토픽 상수 + 이벤트 record(Kafka 페이로드 역직렬화 대상)
    implementation 'com.beomsu.pay:pay-contracts:0.1.0'

    implementation 'org.springframework.boot:spring-boot-starter-web'          // 어드민 REST
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.kafka:spring-kafka'
    // 코어가 발급한 JWT(HS256)를 같은 시크릿으로 로컬 검증한다 — 별도 인증서버 없이 무상태 검증
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
