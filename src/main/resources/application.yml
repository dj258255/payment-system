spring:
  application:
    name: pay

  # PG 정산 파일 업로드 대사용. 정산 CSV는 수만 행이어도 수 MB 수준 → 여유 있게 잡되 무제한은 아님.
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  datasource:
    url: jdbc:mysql://localhost:3306/pay?serverTimezone=UTC&characterEncoding=UTF-8
    username: pay
    password: pay
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 폭주 시 매달리지 않고 빠르게 실패 — 지연이 마비로 번지는 걸 차단.
    # connection-timeout 기본 30초는 폭주 시 요청 스레드가 커넥션을 기다리며 줄줄이 매달려
    # 전면 마비로 번진다. 3초 안에 못 얻으면 에러로 빠르게 떨궈 스레드를 즉시 회수한다.
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000     # 폭주 시 30초 대기 대신 3초 빠른 실패
                                   # 주의: 이건 <풀에서 커넥션을 빌리려고 기다리는> 상한이다.
                                   # 이미 빌린 커넥션의 점유 시간은 못 막는다 —
                                   # 그건 payment.toss.read-timeout 이 맡는다.
      validation-timeout: 2000

  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 마이그레이션으로 관리, JPA는 검증만 (원장 append-only 보호)
    properties:
      hibernate:
        format_sql: true
        # 느린 쿼리를 로그로 남긴다(단위: ms). 임계 초과 시 WARN + 실행된 SQL을 함께 찍는다.
        #
        # 왜 필요한가: 아웃박스 완료 처리가 15만 행을 매번 풀스캔하고 있었는데, 그걸
        # <우연히> 찾았다. 부하 실험 결과가 회차마다 달라 원인을 쫓다 DB를 열어보고서야 알았다
        # (성능 리포트 10절). 성능 리포트는 병목 계측 방법으로 slow query 로그를 적어두고 있었지만
        # 정작 켜져 있지 않았다. 같은 일이 또 나면 또 우연에 기대야 한다.
        #
        # 300ms를 고른 이유: 이 서비스의 결제 승인 p95가 무릎 아래(도착률 100/s)에서 수십~수백 ms다
        # (성능 리포트 12절). 개별 쿼리가 300ms를 넘으면 그건 요청 하나가 통째로 느려질 만한
        # 크기이므로, 정상 트래픽에서는 거의 안 찍히고 이상할 때만 찍힌다.
        # 너무 낮으면 로그가 시끄러워 아무도 안 보게 되고, 너무 높으면 오늘 같은 풀스캔을 놓친다.
        # 프로퍼티 이름 주의: Hibernate 6.1까지는
        # session.events.log.LOG_QUERIES_SLOWER_THAN_MS 였고 6.2에서 log_slow_query로 바뀌었다.
        # 이 프로젝트는 Hibernate 7.4이므로 아래가 맞다. 옛 이름을 쓰면 <조용히 무시된다>.
        log_slow_query: ${APP_SLOW_QUERY_MS:300}
        jdbc:
          time_zone: UTC
    open-in-view: false          # OSIV 비활성화 — 긴 트랜잭션/커넥션 점유 방지 (카카오페이 성능 개선 교훈)

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false          # Redis는 캐시·분산락 용도만 — JPA 리포지토리를 Redis가 넘보는 store-detection 경고 제거

  # 스키마는 Flyway가 관리한다 (원장 append-only 보호를 위해 JPA는 validate만)
  flyway:
    enabled: true
    baseline-on-migrate: true

  # Kafka 외부화용. 기본은 빈 값 → 브로커 없이도 앱이 뜬다. 운영/데모는 KAFKA_BOOTSTRAP로 주입.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:}

  # Spring Modulith Event Publication Registry (= Transactional Outbox) 를 JPA로 영속화
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false         # event_publication은 Flyway(V1)가 생성한다
      republish-outstanding-events-on-restart: true   # 미완료 이벤트 재시도
      # 완료된 이벤트를 event_publication_archive로 옮긴다(기본값 update = 행을 영원히 남김).
      # 이유: 기본값이면 발행량에 비례해 outbox가 무한히 자란다. 부하 실험 6회 만에 150,372행이
      # 됐고, 완료 처리 쿼리(serialized_event + listener_id 등치)가 그 전체를 풀스캔했다
      # — 즉 결제 지연이 "그동안 처리한 이벤트 총량"에 비례해 나빠진다(V24 참고).
      # archive는 감사 흔적을 버리지 않으면서(delete와 다름) 핫 테이블에 크기 상한을 준다.
      completion-mode: archive
      externalization:
        # 기본 off. 브로커가 없으면 @Externalized 이벤트를 Kafka로 내보내지 않는다
        # → 브로커 없이 부팅/테스트가 깨지지 않고, Outbox 기반 인프로세스 소비는 그대로 동작한다.
        # 운영/데모에서 kafka 프로파일로 켠다(아래 --- kafka 문서 참고).
        enabled: false

  # 우아한 종료(graceful shutdown) — SIGTERM을 받으면 새 요청은 받지 않고(수용 중단),
  # 진행 중인 결제 요청은 완료까지 드레이닝한 뒤 종료한다(배포 시 인플라이트 결제 강제 중단 방지).
  # 드레이닝이 아래 timeout-per-shutdown-phase(20초)를 넘기면 남은 요청을 끊고 강제 종료한다.
  lifecycle:
    timeout-per-shutdown-phase: 20s

# 폭주 시 스레드 무한 증식 대신 상한 — 초과 유입은 컨테이너 수용 큐에서 대기·거절되어
# 힙/컨텍스트 스위칭 폭발로 번지지 않는다(기본 200 → 100, DB 풀 20과 균형).
server:
  # SIGTERM 시 새 요청은 안 받고 진행 중 결제는 완료까지 드레이닝(위 timeout 안에서). 최대 대기 후 강제 종료.
  # (k8s면 LB 디레지스터 경합을 없애려 preStop sleep 지연도 필요하나, 단일 프로세스라 여기선 설정만 둔다.)
  shutdown: graceful
  tomcat:
    threads:
      max: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, modulith, prometheus
  metrics:
    tags:
      application: pay
    distribution:
      # HTTP 요청 지연을 히스토그램 버킷으로 발행 → Prometheus에서 p95/p99를
      # histogram_quantile로 서버측 집계(대시보드의 "요청 p99 레이턴시" 소스).
      # 버킷을 안 켜면 _count/_sum/_max만 나와 분위수 산출이 불가능하다.
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    org.springframework.modulith: INFO

# 애플리케이션 시크릿 — 운영에서는 반드시 환경변수/시크릿 매니저로 주입한다.
# 아래 값은 로컬 개발 전용 기본값(env가 우선). 코드에는 키를 두지 않는다.
app:
  # 상담 답변 초안 (ADR-014). 기본은 외부 호출이 없는 템플릿.
  webhook:
    # 웹훅이 승인 응답보다 먼저 도착한 건을 다시 처리한다. 기본 off — 다른 배치와 같은 규약.
    pending-retry:
      enabled: ${APP_WEBHOOK_PENDING_RETRY_ENABLED:false}
    pending-interval-ms: ${APP_WEBHOOK_PENDING_INTERVAL_MS:5000}
    pending-max-retry: ${APP_WEBHOOK_PENDING_MAX_RETRY:12}

  assist:
    # template | ollama | anthropic
    #   template  — 외부 호출 없음. 기준선이자 폴백
    #   ollama    — 로컬 모델. 데이터가 기계 밖으로 안 나간다
    #   anthropic — 외부 API. BYOK(운영자가 자기 키를 넣는다).
    #               생성형 AI 는 아직 금융권 망분리 예외가 아니다 — 켜는 것은 의식적 선택이어야 한다
    draft-provider: ${APP_ASSIST_DRAFT_PROVIDER:template}
    # 장애 로그 원인 분석. rule | ollama | rule-first
    #   rule       — 규칙만. 실 로그 12건에서 맞음 7·기권 5·틀림 0. 아는 것만 답한다
    #   ollama     — 모델만. 맞음 11·기권 0·틀림 1. 규칙이 확실히 답하던 7건까지 오답 위험에 노출된다
    #   rule-first — 규칙이 먼저 답하고 <기권한 자리에만> 모델. 맞음 11·기권 0·틀림 1
    # 기본값이 rule-first 인 이유: 규칙이 답한 7건은 모델을 안 거치면서 답을 4건 더 얻는다.
    # 모델이 낸 답은 IncidentDiagnosis.source() 가 MODEL 로 표시하며 확정은 사람이 한다.
    incident-provider: ${APP_ASSIST_INCIDENT_PROVIDER:rule-first}
    # 확정 시 초안을 만들어 <기록만> 한다. 사람에게 보여주지 않아 앵커링이 생기지 않는다.
    # 기본 꺼짐 — 확정마다 타임라인 조립(10개 도메인) 비용이 붙는다.
    shadow-enabled: ${APP_ASSIST_SHADOW_ENABLED:false}
    ollama:
      base-url: ${APP_ASSIST_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${APP_ASSIST_OLLAMA_MODEL:qwen3:14b}
      narrative-model: ${APP_ASSIST_OLLAMA_NARRATIVE_MODEL:qwen3:8b}
    # 운영자용 타임라인 서술(18 문서). 어드민 화면에서 "이 주문에 무슨 일이 있었나"를
    # 한 문단으로 돌려준다. 읽기 전용이고 고객에게 나가지 않는다.
    #
    # 기본은 template — 모델 없이 사실을 시간순으로 잇기만 한다. 이 문장이 <모델이 넘어야 할
    # 자>다. 모델 서술이 이것보다 나은지 재지 않으면 "붙였다"만 남는다.
    #
    # 분류가 아니라 서술이라 이 자리에는 규칙 대비 개선이 처음부터 존재한다 —
    # 규칙은 문장을 못 쓴다. 잔여 후보(15 문서)를 끈 이유와 정확히 반대다.
    #
    # <b>기본값을 ollama 로 바꿨다(18 문서 10절).</b> 어느 쪽 문장이 더 읽히는지는 아직 못 쟀다.
    # 사람이 고른 표본이 0건이고, 강한 심판을 세워 본 26 대 4 는 템플릿이 "그다음" 사슬이라
    # 한눈에 구별돼 블라인드가 성립하지 않았다. 그러니 <더 낫다>를 근거로 켜는 것이 아니다.
    #
    # 켜는 근거는 <더 나쁠 수 없게 만들었다>다. 모델 서술이 가드에 걸리면(지어낸 숫자·빠뜨린
    # 금액) 예전에는 화면이 통째로 비었고, 금액 결손은 30건 중 0~4건으로 간헐적이라 그 확률로
    # 빈 화면을 봤다. 이제 그 자리에서 템플릿으로 떨어진다. 모델을 켠 최악이 템플릿을 켠 것과
    # 같아졌으므로, 못 잰 것이 위험으로 남지 않는다.
    #
    # 사람이 고른 25~30건이 모이면 그때 <더 나은가>를 판정한다. 그 전까지는 이 상태다.
    narrative-provider: ${APP_ASSIST_NARRATIVE_PROVIDER:ollama}
    # 규칙 분류기가 <결정적 후보를 못 낸> 건에만 모델이 원인을 제안한다(14 문서).
    # 제안까지만 한다 — resolve 는 사람이 한다.
    #
    # <b>기본 off 로 되돌렸다(15 문서).</b> 켠 유형은 INTERNAL_RECORD_LOST 하나였는데,
    # 홀드아웃을 재고 나서 그 하나마저 모델이 필요 없다는 것이 드러났다.
    #
    #   - 프롬프트가 켠 유형만 보여주므로 모델의 답은 그 값 아니면 기권 둘뿐이다
    #   - 그 값이 통과하는 조건은 대사 결과가 EXTERNAL_ONLY 일 때다(가드 8)
    #   - 그런데 그 조건에서 규칙 분류기가 이미 같은 값을 낸다
    #
    # 즉 모델이 할 수 있는 최선이 <규칙에 동의하는 것>이라, 규칙 대비 얻는 것이 없다.
    # 후보 모델을 올릴 때 기준이 되는 것은 절대 정확도가 아니라 <기존 방식 대비 개선>인데,
    # 그 값이 0 이다. 평가 하네스(./gradlew evalTest)와 가드는 남겨 둔다 —
    # 규칙이 못 가르는 유형을 열 수 있게 되면 그때 다시 켠다.
    residual-provider: ${APP_ASSIST_RESIDUAL_PROVIDER:template}
    residual:
      # 후보를 만들되 화면에 안 주는 비율. 비교군을 만들기 위해서다.
      # 제안을 보여준 건만 모으면 "제안 덕분"과 "원래 그랬을 것"을 가를 수 없다.
      # 0 이면 비교군이 없어 채택률만 남고, 그 숫자는 앵커링에 오염돼 있다.
      blind-percent: ${APP_ASSIST_RESIDUAL_BLIND_PERCENT:20}
      # 이 값 미만이면 기권한다. 규칙이 못 가른 건은 어려운 건이라,
      # 아무거나 고르면 확인하는 사람의 일이 오히려 는다.
      min-confidence: ${APP_ASSIST_RESIDUAL_MIN_CONFIDENCE:70}
    # 제안을 화면에 안 띄우고 기록만 해 사람의 확정과 대조한다(Ramp 섀도 모드).
    residual-shadow-enabled: ${APP_ASSIST_RESIDUAL_SHADOW_ENABLED:false}
    # 초안이 <근거 없이 단정>하는지 다른 계열 모델에게 묻는다(ADR-014).
    # 기본 꺼짐 — 호출이 한 번 더 늘어난다. 켤 때는 초안 모델과 다른 계열이어야 한다.
    judge:
      enabled: ${APP_ASSIST_JUDGE_ENABLED:false}
      model: ${APP_ASSIST_JUDGE_MODEL:llama3.1:8b}
    anthropic:
      # 비워 두면 provider=anthropic 일 때 기동이 막힌다. 호출 시점에 실패하면
      # 초안이 조용히 비어 나가고 아무도 모른다.
      api-key: ${APP_ASSIST_ANTHROPIC_API_KEY:}
      model: ${APP_ASSIST_ANTHROPIC_MODEL:claude-sonnet-5}
  crypto:
    # 평문 하위호환을 끝내는 스위치. 재암호화가 끝나 crypto.legacy.plaintext.reads 가
    # 0이 된 뒤 true 로 켠다. 그러면 남아 있던 평문이 조용히 통과하지 않고 실패한다.
    # 지표와 스위치가 같이 있어야 "언젠가 다 됐겠지"로 끝나지 않는다.
    fail-on-legacy-plaintext: ${APP_CRYPTO_FAIL_ON_LEGACY_PLAINTEXT:false}
    key: ${APP_CRYPTO_KEY:devlocalkey_0123456789abcdef0123}   # (단일 키·AesGcmFieldCipher용) AES-256=32바이트, 운영은 KMS/env
    # 필드 암호화 방식: envelope(기본, DEK/KEK) | simple(단일 키 AesGcm).
    # envelope은 데이터를 매번 새 DEK로 암호화하고 그 DEK를 KEK(마스터키)로 감싸(wrap) 함께 저장한다.
    # → 키 로테이션 시 데이터 전체 재암호화 없이 작은 DEK만 새 KEK로 재-wrap한다(EnvelopeFieldCipher.rewrapToCurrent).
    # 운영에서는 아래 kek를 실 KMS(AWS KMS/Vault)로 옮겨 keyFor 구현만 교체한다(마스터키를 프로세스 밖에 보관).
    # 주의: envelope 암호문은 wrap된 DEK를 함께 실어 단일 키보다 길다 → 민감 컬럼 길이를 넉넉히 잡을 것.
    mode: ${APP_CRYPTO_MODE:envelope}
    kek:
      current: ${APP_KEK_CURRENT:v1}                          # 현재 wrap에 쓸 KEK 버전
      v1: ${APP_KEK_V1:kek-v1-local-0000000000000000000}      # 필수, AES-256=32바이트. 운영은 env/KMS
      v2: ${APP_KEK_V2:}                                       # 옵션(로테이션 데모). 있으면 등록, current를 v2로 올릴 수 있다
    # 블라인드 인덱스(HMAC-SHA256) secret — 암호화된 빌링키의 동등 조회·유니크를 대체한다.
    # 같은 빌링키는 항상 같은 인덱스가 되어 findByBillingKeyIndex로 찾는다. 16바이트 이상(BlindIndexer fail-fast).
    # 운영은 반드시 env/시크릿 매니저로 주입한다(아래는 로컬 개발 전용 기본값).
    blind-index-secret: ${APP_BLIND_INDEX_SECRET:blind-index-local-secret-0000000000}
  jwt:
    # HS256 대칭 서명 키. 로컬/테스트 편의로 32바이트 이상 기본값을 두되, 운영은 env로 오버라이드.
    # 런타임에 길이(<32바이트)를 검증해 약한 키로 뜨는 것을 막는다(JwtConfig fail-fast).
    secret: ${APP_JWT_SECRET:local-dev-only-please-override-with-32byte-min-secret-key}
    # access: 짧게(서명·폐기 검증만) / refresh: 길게(Redis에만 존재, 회전·폐기 가능).
    # 짧은 access + 긴 refresh로 재로그인 없이 세션을 연장하고, 폐기는 Redis denylist로 처리한다.
    access-expiry-minutes: ${APP_JWT_ACCESS_MIN:30}
    refresh-expiry-days: ${APP_JWT_REFRESH_DAYS:14}
  admin:
    password: ${APP_ADMIN_PASSWORD:admin-local-only}
  user:
    password: ${APP_USER_PASSWORD:user-local-only}
  # 멀티 PG 라우팅 — 기본 off(단일 PG). 켜면 RoutingPgClient가 pgDelegate가 되어 여러 PG를
  # 가중치 순으로 시도하고 장애 시 failover한다(TIMEOUT은 이중결제 방지로 failover 안 함).
  # PgRoutingConfig + FakePgClient의 @ConditionalOnProperty가 이 값으로 함께 토글된다.
  #
  # 켜면 POST /api/v1/payments/init 이 <결제창을 띄우기 전에> PG를 고른다. 차단기가 열린
  # PG는 후보에서 빠진다. 승인 단계 failover 가 아니다 — 결제 키는 그 PG의 결제창에서
  # 발급되므로 다른 곳에 보내면 성공률이 0이고, 진행 중 거래를 넘기면 이중결제가 난다.
  # 고르는 시점을 앞으로 옮긴 것이고, 포트원 스마트 라우팅이 channelGroupId 로 하는 것과 같은 구조다.
  pg:
    routing:
      enabled: ${APP_PG_ROUTING_ENABLED:false}
  # 이상거래탐지(FDS) 설정.
  fds:
    velocity:
      # velocity 카운터를 공유 Redis로 셀지 여부. 기본 true(RedisVelocityCounter @Primary) — 다중
      # 인스턴스에서 카운트가 정확하다. false면 InMemoryVelocityCounter로 폴백(단일 인스턴스·테스트용).
      redis: ${APP_FDS_VELOCITY_REDIS:true}
  # 보상(망취소) 재시도 스케줄러 — 기본 off(테스트/부트 부작용 방지). 운영에서 env로 켠다.
  compensation:
    enabled: ${APP_COMPENSATION_ENABLED:false}
    interval-ms: 5000

  # 아래 배치들은 로직만 있고 주기 호출자가 없던 것들 — 스케줄러를 붙여 주기 실행하고, outbox
  # 완료 이벤트도 주기 정리한다. 모두 기본 off(@ConditionalOnProperty 게이트로 테스트/부트 무영향).
  # 운영에서 env로 켠다(각 스케줄러는 짝이 되는 @EnableScheduling 게이트도 같은 프로퍼티로 함께 켜진다).

  # 미확정(UNKNOWN) 결제 복구 스케줄러 → PaymentRecoveryService.recoverUnknownPayments()
  recovery:
    enabled: ${APP_RECOVERY_ENABLED:false}
    interval-ms: 60000
  # 멈춘 체크아웃 사가 복구 스케줄러(ADR-007) → CheckoutRecoveryService.recoverStuckCheckouts().
  # 예약(Phase1) 후 확정(Phase3) 전에 크래시로 PAYMENT_IN_PROGRESS로 멈춘 주문을 PG 조회로 완결/롤백.
  checkout:
    recovery:
      enabled: ${APP_CHECKOUT_RECOVERY_ENABLED:false}
      interval-ms: 60000
      stuck-after-minutes: ${APP_CHECKOUT_RECOVERY_STUCK_AFTER_MIN:10}
  # 가상계좌 만료 배치 스케줄러 → VirtualAccountService.expireOverdue(now)
  va:
    expiry:
      enabled: ${APP_VA_EXPIRY_ENABLED:false}
      interval-ms: 60000
  # 구독 정기결제(dunning) 스케줄러 → SubscriptionService.runBillingCycle(today). 청구 주기라 기본 1시간.
  dunning:
    enabled: ${APP_DUNNING_ENABLED:false}
    interval-ms: 3600000
  # 주문 만료 배치 스케줄러 → OrderExpiryService.expireOverdue(now) (PENDING_PAYMENT+만료시각 경과 → EXPIRED)
  order:
    expiry:
      enabled: ${APP_ORDER_EXPIRY_ENABLED:false}
      interval-ms: 60000
  # Modulith Outbox(event_publication) 완료 이벤트 정리 스케줄러 → 무한 성장 방지. 기본 1시간 주기, 7일 보존.
  outbox:
    cleanup:
      enabled: ${APP_OUTBOX_CLEANUP_ENABLED:false}
      interval-ms: 3600000
      retention-days: ${APP_OUTBOX_RETENTION_DAYS:7}
  # 멱등키(idempotency_keys) 정리 스케줄러 → 무한 성장 방지. TTL은 15일(토스페이먼츠 정합)로 그대로 두고,
  # 유효기간 지난 레코드만 주기 삭제해 15일치로 크기 유지. 기본 1시간 주기.
  idempotency:
    cleanup:
      enabled: ${APP_IDEMPOTENCY_CLEANUP_ENABLED:false}
      interval-ms: 3600000
  # 일 단위 정산 배치 스케줄러 → SettlementService.settle(전일). 하루 마감이라 기본 24시간 주기.
  # 수수료율은 bps(270=2.7%), 지급예정일은 정산일 + N영업일(주말 skip). 스케줄러는 기본 off(게이트).
  settlement:
    enabled: ${APP_SETTLEMENT_ENABLED:false}
    interval-ms: 86400000
    fee-bps: ${APP_SETTLEMENT_FEE_BPS:270}            # 수수료율(basis point) 270 = 2.7%
    payout-business-days: ${APP_SETTLEMENT_PAYOUT_DAYS:2}   # 지급예정일 = 정산일 + N영업일
  # API 유입 제어(rate limit) — "감당 못 할 요청은 바깥 층에서 싸게 거절한다(429)".
  # 대상: POST /api/v1/orders, POST /api/v1/payments/confirm (RateLimitFilter, 시큐리티 체인 내
  # Bearer 인증 뒤). 고정 윈도우(1초) INCR — 경계 순간 최대 2배 통과는 단순성의 대가로 수용.
  ratelimit:
    enabled: ${APP_RATELIMIT_ENABLED:true}       # k6 전/후 비교용 스위치 — false면 필터가 전부 통과
    per-user-per-sec: ${APP_RATELIMIT_PER_USER:5}   # 사용자당 초당 허용(스크립트·이중클릭 억제)
    # 경로당 전체 초당 허용(DB로 가는 총량 캡).
    #
    # 이 100은 처음에 짐작으로 정한 값이었다. 나중에 두 번 쟀고, 답이 갈렸다(성능 리포트 9·12절).
    #
    #   닫힌 루프(ramping-vus): ~120/s → "상한이 낮다"
    #   개방 루프(constant-arrival-rate): 무릎 100~120/s → "상한이 대체로 맞다"
    #
    # 개방 루프가 맞다. 닫힌 루프는 서버가 느려지면 VU도 같이 기다려 <부하가 스스로 줄어든다>.
    # 실사용 트래픽은 우리가 느리다고 요청을 줄여주지 않는다. 그래서 12절 결론을 채택한다.
    #
    # 그래도 이 값은 맥북 로컬에서 나온 숫자다. 배포 환경마다 다시 재고 그 환경의 값으로
    # 덮어쓸 것(env APP_RATELIMIT_GLOBAL):
    #   docker compose down -v && docker compose up -d mysql redis
    #   APP_RATELIMIT_ENABLED=false ./gradlew bootRun    # 켠 채 재면 설정값을 재는 동어반복이 된다
    #   k6 run k6/capacity-knee.js
    # 스크립트가 "성공률이 온전한 마지막 단계"를 무릎으로 찍어준다. 상한은 그 근처에 둔다 —
    # 훨씬 낮으면 멀쩡한 요청을 버리고, 훨씬 높으면 상한이 아무것도 막지 못한다.
    #
    # 운영 중 판단은 지표로 한다: ratelimit_rejected_total{scope="global"}이 지속적으로 오르는데
    # 처리량이 상한보다 한참 낮으면 상한이 낮은 것이고, 상한 근처에서 평평하면 진짜 포화다.
    global-per-sec: ${APP_RATELIMIT_GLOBAL:100}

  # 선착순 대기열(Redis ZSET) — 순간 트래픽 폭증 시 DB 유입을 제어한다.
  queue:
    # 앞에서부터 이 인원(rank < admit-limit)만 "입장"시켜 결제로 보낸다 — DB 유입 제어의 상한.
    admit-limit: ${APP_QUEUE_ADMIT_LIMIT:100}
    # 입장권(admit:{eventId}:{userId}) TTL — admitted 판정 순간 발급되고, 이 시간 안에 주문까지
    # 마쳐야 한다. 만료되면 다시 status 폴링으로 재발급받으면 된다(줄에 있으면 즉시).
    pass-ttl-seconds: ${APP_QUEUE_PASS_TTL:600}
    # 대기열 게이트(옵트인): 아래 상품이 주문에 포함되면 서버가 입장권을 강제한다(권고→강제).
    # 기본 빈 목록 = 게이트 비활성 — 기존 주문 경로 100% 불변, 대상 없으면 무비용.
    gate:
      event-id: ${APP_QUEUE_GATE_EVENT:drop}       # 입장권을 검사할 이벤트 ID
      product-ids: ${APP_QUEUE_GATE_PRODUCTS:}     # 쉼표 구분 productId 목록(예: "1,2")
  # 에스크로(자금 보류) — 결제금을 구매확정 전까지 HELD로 잡아둔다.
  escrow:
    # 자동 구매확정까지의 보류 기간(일). 이 기간 무응답이면 자동 릴리스 대상이 된다.
    hold-period-days: ${APP_ESCROW_HOLD_DAYS:7}
    # 자동 릴리스 스케줄러 — 기본 off(테스트/부트 부작용 방지). 운영에서 env로 켠다.
    auto-release:
      enabled: ${APP_ESCROW_AUTO_RELEASE_ENABLED:false}
      interval-ms: 60000

# 웹훅 서명 검증(HMAC-SHA256) 시크릿. 아래는 로컬 개발 전용 기본값(16바이트 이상)이고, 운영은
# 반드시 env/시크릿 매니저로 오버라이드한다. 미설정/약한 키면 기동을 실패시킨다(WebhookSignatureVerifier fail-fast).
payment:
  webhook:
    secret: ${PAYMENT_WEBHOOK_SECRET:local-webhook-secret-please-override-32b}
    # 토스 웹훅 발신 IP 허용 목록(쉼표 구분). 비우면 검사하지 않는다 — 다른 기능과 같은 규약으로
    # 기본 off 다. 앱이 프록시·터널 뒤에 있으면 보이는 IP가 토스가 아니라 그 프록시라서, 켜면
    # 정상 웹훅까지 막힌다. <b>앞단이 있으면 이 검사는 앱이 아니라 그 앞단이 해야 한다.</b>
    # 토스가 공개한 발신 IP(2026-09 기준):
    #   13.124.18.147,13.124.108.35,3.36.173.151,3.38.81.32,
    #   115.92.221.121,115.92.221.122,115.92.221.123,
    #   115.92.221.125,115.92.221.126,115.92.221.127
    toss-allowed-ips: ${PAYMENT_WEBHOOK_TOSS_ALLOWED_IPS:}

---
# kafka 프로파일: 브로커가 있을 때만 활성화한다(예: SPRING_PROFILES_ACTIVE=kafka).
# 외부화를 켜고, 유실 방지(acks=all)·중복 억제(멱등 producer)를 갖춘 producer를 구성한다.
# 이 문서를 활성화하지 않으면(기본) 위의 externalization.enabled=false가 유지되어 브로커 없이도 뜬다.
spring:
  config:
    activate:
      on-profile: kafka
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Modulith 외부화는 이벤트를 이미 JSON byte[]로 직렬화해 넘긴다. JsonSerializer를 쓰면
      # 그 byte[]가 다시 JSON(base64 문자열)으로 감싸져 이중 인코딩된다(소비자 실검증에서 발견).
      # ByteArraySerializer로 그대로 실어야 와이어에 깨끗한 JSON이 나간다.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all                    # 유실 방지 — 모든 in-sync 복제본이 받아야 성공
      properties:
        enable.idempotence: true   # 멱등 producer — 재시도로 인한 중복 발행 억제
  modulith:
    events:
      externalization:
        enabled: true              # @Externalized 이벤트를 Kafka로 발행(Outbox가 유실 방지, at-least-once)
