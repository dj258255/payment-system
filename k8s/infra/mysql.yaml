# MySQL 8.4 — 개발용 단일 인스턴스(emptyDir, 파드 재시작 시 초기화).
# 운영이라면 StatefulSet + PVC 또는 관리형 DB(RDS 등)를 쓴다.
# compose의 docker/mysql-init와 같은 init SQL을 ConfigMap으로 마운트해
# 서비스별 database(pay / pay_settlement / pay_notification)를 만든다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
data:
  01-create-settlement-db.sql: |
    CREATE DATABASE IF NOT EXISTS pay_settlement CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
    GRANT ALL PRIVILEGES ON pay_settlement.* TO 'pay'@'%';
    FLUSH PRIVILEGES;
  02-create-notification-db.sql: |
    CREATE DATABASE IF NOT EXISTS pay_notification CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
    GRANT ALL PRIVILEGES ON pay_notification.* TO 'pay'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  strategy:
    type: Recreate           # emptyDir 단일 인스턴스 — 롤링 불가(두 개가 같은 데이터를 못 가짐)
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_DATABASE, value: pay }
            - { name: MYSQL_USER, value: pay }
            - { name: MYSQL_PASSWORD, value: pay }
            - { name: MYSQL_ROOT_PASSWORD, value: root }
          ports:
            - containerPort: 3306
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-uroot", "-proot"]
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            # cpu request는 노드 포화 시 CFS 가중치다 — 250m이던 시절, 롤링+부하로 노드가
            # 포화되자 MySQL이 밀려 신규 커넥션(TCP)조차 못 받았고 부팅 파드가 Flyway에서
            # 죽었다(실측). DB는 전체의 공유 병목이므로 앱보다 높은 가중치를 준다.
            requests: { cpu: "1", memory: 768Mi }
            # 1Gi limit에서 부하 중 OOMKill 3회 실측 — MySQL 8 버퍼풀+커넥션이 1Gi를 넘는다.
            limits: { memory: 1536Mi }
      volumes:
        - { name: init, configMap: { name: mysql-init } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app: mysql }
  ports:
    - port: 3306
