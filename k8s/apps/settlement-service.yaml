# settlement-service — 정산 배치·집계·지급 (스케줄러 단일 소유자).
# replicas는 1로 고정한다 — @Scheduled는 컨슈머 그룹처럼 나눠지지 않아 다중화 시
# 중복 실행이 재발한다(ADR-016 정직한 한계). 다중화가 필요해지면 ShedLock/리더 선출.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
spec:
  replicas: 1
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }  # 용량 유지 — 새 파드 Ready 후 교체
  selector:
    matchLabels: { app: settlement-service }
  template:
    metadata:
      labels: { app: settlement-service }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: settlement-service
          image: settlement-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8090
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/pay_settlement" }
            - { name: SPRING_DATASOURCE_USERNAME, value: pay }
            - { name: SPRING_DATASOURCE_PASSWORD, value: pay }
            - name: APP_JWT_SECRET
              valueFrom: { secretKeyRef: { name: pay-jwt, key: APP_JWT_SECRET } }
          startupProbe:                       # 부팅 전담 — 5s×24회(2분)까지 기다린다.
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            periodSeconds: 5
            failureThreshold: 24
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8090 }
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 3                 # 기본 1s는 CPU 경합에서 오탐 — 실측으로 확인한 함정
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8090 }
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
spec:
  selector: { app: settlement-service }
  ports:
    - port: 8090
