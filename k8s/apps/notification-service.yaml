# notification-service — 알림 발송·멱등 소비·DLQ 어드민.
# 스케줄러가 없어 다중화에 스케줄러 제약은 없다. 컨슈머 그룹 리밸런싱 중 일시적
# 중복 배달은 ProcessedEvent 멱등층이 흡수한다(ADR-010).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: notification-service
          image: notification-service:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8091
          env:
            - { name: KAFKA_BOOTSTRAP, value: "kafka:9092" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://mysql:3306/pay_notification" }
            - { name: SPRING_DATASOURCE_USERNAME, value: pay }
            - { name: SPRING_DATASOURCE_PASSWORD, value: pay }
            - name: APP_JWT_SECRET
              valueFrom: { secretKeyRef: { name: pay-jwt, key: APP_JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8091 }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8091 }
            initialDelaySeconds: 30
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports:
    - port: 8091
