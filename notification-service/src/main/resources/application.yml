server:
  port: 8091

spring:
  application:
    name: pay-notification

  # pay와 분리된 전용 스키마(compose init 스크립트가 생성). 운영이라면 인스턴스 분리.
  datasource:
    url: jdbc:mysql://localhost:3306/pay_notification
    username: pay
    password: pay
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate            # 스키마는 Flyway가 소유한다
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: notification-service # settlement-service와 독립된 그룹 — 같은 이벤트를 각자 소비
      auto-offset-reset: earliest    # 신규 그룹은 처음부터 재생. 멱등(ProcessedEvent)이라 안전
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # 역직렬화 실패(poison)의 DLT 발행용
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: pay-notification

app:
  # pay-core와 공유하는 JWT 서명 시크릿(HS256) — 코어 발급 토큰을 로컬 검증
  jwt:
    secret: ${APP_JWT_SECRET:local-dev-only-please-override-with-32byte-min-secret-key}
  # 데모 콘솔 오리진(DLQ 탭이 직접 호출). K8s Ingress 도입 시 same-origin이 되어 제거
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:8080}
