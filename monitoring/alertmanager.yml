# Alertmanager — 알림 규칙이 <실제로 갈 곳>을 정한다.
#
# 규칙만 있고 받는 데가 없으면 아무도 모른다. UnknownPaymentAging 이 울려도
# 그래프에만 빨간 줄이 그어질 뿐이다. 관측은 <누가 보느냐>까지가 설계다.
#
# 슬랙 웹훅 URL 은 코드에 두지 않는다. 환경변수로 넣는다.
#   export SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...'
#   alertmanager --config.file=monitoring/alertmanager.yml
global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: 'slack-ops'
  # 같은 알림이 반복 발화해도 30분에 한 번만 보낸다.
  # 미확정 결제가 쌓이는 상황은 몇 초마다 재알림해도 대응이 빨라지지 않고,
  # 채널이 시끄러워지면 사람이 알림 자체를 끈다.
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 30m
  routes:
    # 돈이 걸린 것과 그렇지 않은 것을 나눈다. 같은 채널에 섞으면
    # "옛 해시가 남아 있다"와 "미확정 결제가 10분째"가 같은 무게로 보인다.
    - matchers: [severity="critical"]
      receiver: 'slack-critical'
      repeat_interval: 10m

receivers:
  - name: 'slack-ops'
    slack_configs:
      - channel: '#pay-alerts'
        title: '{{ .CommonLabels.alertname }}'
        # 무엇이 울렸는지보다 <무엇을 해야 하는지>를 먼저 보여준다.
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: 'slack-critical'
    slack_configs:
      - channel: '#pay-alerts-critical'
        title: '[critical] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
