# Alertmanager — 알림 규칙이 <실제로 갈 곳>을 정한다.
#
# 규칙만 있고 받는 데가 없으면 아무도 모른다. UnknownPaymentAging 이 울려도
# 그래프에만 빨간 줄이 그어질 뿐이다. 관측은 <누가 보느냐>까지가 설계다.
#
# 슬랙 웹훅 URL 은 코드에 두지 않는다. 환경변수로 넣는다.
#   export SLACK_WEBHOOK_URL='https://hooks.slack.com/services/...'
#   alertmanager --config.file=monitoring/alertmanager.yml
global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  receiver: 'slack-ops'
  # 같은 알림이 반복 발화해도 30분에 한 번만 보낸다.
  # 미확정 결제가 쌓이는 상황은 몇 초마다 재알림해도 대응이 빨라지지 않고,
  # 채널이 시끄러워지면 사람이 알림 자체를 끈다.
  # <b>도메인으로 묶는다.</b> 알림 이름으로 묶으면 <b>한 고장이 알림 여러 개를 그대로 내보낸다.</b>
  # 실제로 재 봤다(promtool 시나리오 db-outage-probe): DB 하나가 죽으면 여섯 개가 동시에 뜬다.
  #   PaymentSuccessRateLow · UnknownPaymentAging · CompensationExhausted
  #   OutboxConsumptionStalled · OptimisticLockRetryRising · ReconPendingBacklog
  # 이름으로 묶으면 이게 여섯 건으로 나가고, 도메인으로 묶으면 payment 다섯 + settlement 하나가 된다.
  #
  # 업계 수치로는 온콜이 주 50건을 받는데 실제 조치가 필요한 건 2~5% 다. 교대당 40건을
  # 넘으면 MTTR 이 3배가 된다. 규칙 기반 그룹핑만으로 60~80% 가 줄어든다고 보고돼 있어
  # 여기에 모델을 넣지 않았다 — 도메인은 알림마다 이미 아는 값이라 추론할 것이 없다.
  group_by: ['domain', 'severity']
  # 첫 알림을 30초 더 기다린다. 한 고장에서 뒤따라 뜨는 것들을 같은 묶음에 담기 위해서다.
  # 이 값이 짧으면 첫 알림만 따로 나가고 나머지가 두 번째 묶음이 된다.
  group_wait: 60s
  group_interval: 5m
  repeat_interval: 30m
  routes:
    # 돈이 걸린 것과 그렇지 않은 것을 나눈다. 같은 채널에 섞으면
    # "옛 해시가 남아 있다"와 "미확정 결제가 10분째"가 같은 무게로 보인다.
    - matchers: [severity="critical"]
      receiver: 'slack-critical'
      repeat_interval: 10m

receivers:
  - name: 'slack-ops'
    slack_configs:
      - channel: '#pay-alerts'
        title: '{{ .CommonLabels.alertname }}'
        # 무엇이 울렸는지보다 <무엇을 해야 하는지>를 먼저 보여준다.
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

  - name: 'slack-critical'
    slack_configs:
      - channel: '#pay-alerts-critical'
        title: '[critical] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
